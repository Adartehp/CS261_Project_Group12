<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งซ่อม</title>
 
    <link rel="stylesheet" href="style3.css">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  
    <header class="navbar">
        <div class="menu-icon" id="menuHomeBtn" title="กลับสู่หน้าหลัก">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="profile-icon">
            <i class="fa-solid fa-user"></i>
        </div>
    </header>

   
    <main class="main-container">
        <h1 class="page-title">แจ้งซ่อม</h1>

        
        <div class="form-card">
            <form id="repairForm">
                
               
                <div class="input-group">
                    <label for="studentId">รหัสนักศึกษา</label>
                    <input type="text" id="studentId" placeholder="รหัสนักศึกษา">
                </div>

               
                <div class="input-group">
                    <label for="room">ห้อง *</label>
                    <input type="text" id="room" placeholder="รหัสห้องพัก">
                </div>

                
                <div class="input-group">
                    <label for="area">พื้นที่ *</label>
                    <div class="select-wrapper">
                        <select id="area">
                            <option value="" disabled selected>เลือกพื้นที่ห้อง</option>
                             <option value="bedroom">ห้องนอน</option>
                            <option value="restroom">ห้องนั่งเล่น (เฉพาะโซน B)</option>
                            <option value="centerpoint">พื้นที่ส่วนกลาง</option>
                            <option value="bathroom">ห้องน้ำ</option>
                            <option value="balcony">ระเบียง+ลานซักผ้า</option>
                            <option value="key">รายการกุญแจ</option>
                            <option value="air">เครื่องปรับอากาศ (แอร์)</option>
                        </select>
                        <i class="fa-solid fa-caret-up arrow-icon"></i>
                    </div>
                </div>

               
                <div class="input-group">
                    <label for="repairItem">รายการซ่อม *</label>
                    <div class="select-wrapper">
                        <select id="repairItem">
                            <option value="" disabled selected>เลือกสิ่งที่ต้องการซ่อม</option>
                           <option value="ac">โต๊ะเครื่องแป้ง</option>
                            <option value="ac">ชั้นวางของ</option>
                            <option value="ac">บานเกล็ด</option>
                            <option value="ac">สัญญาณโทรทัศน์</option>
                            <option value="ac">พัดลมดูดอากาศ</option>
                            <option value="ac">อื่นๆ</option>
                            <option value="ac">อินเทอร์เน็ต</option>
                            <option value="ac">กระจกเงา</option>
                            <option value="ac">ลูกบิดประตู</option>
                            <option value="ac">ผ้าม่าน</option>
                            <option value="ac">ประตูมุ้งลวด</option>
                            <option value="ac">ประตูกระจกบานเลื่อน</option>
                            <option value="ac">ฟูกที่นอน</option>
                            <option value="ac">ประตู</option>
                            <option value="ac">หลอดไฟ</option>
                            <option value="ac">สวิทซ์ไฟ</option>
                            <option value="ac">รีโมทโทรทัศน์</option>
                            <option value="ac">รีโมทเครื่องปรับอากาศ</option>
                            <option value="ac">พัดลมเพดาน</option>
                            <option value="ac">ตู้เย็น</option>
                            <option value="ac">ปลั๊กไฟ</option>
                            <option value="ac">โทรทัศน์</option>
                            <option value="ac">เครื่องปรับอากาศ</option>
                            <option value="ac">โต๊ะหัวเตียง</option>
                            <option value="ac">โต๊ะรับประทานอาหาร</option>
                            <option value="ac">โต๊ะทำงาน</option>
                            <option value="ac">เตียง</option>
                            <option value="ac">ตู้เสื้อผ้า</option>
                            <option value="ac">ชั้นวางของ</option>
                            <option value="ac">เก้าอี้</option>
                        </select>
                        <i class="fa-solid fa-caret-up arrow-icon"></i>
                    </div>
                </div>

              
                <div class="input-group">
                    <label for="details">รายละเอียดการซ่อม <span class="optional">( ไม่จำเป็น )</span></label>
                    <textarea id="details" maxlength="150" placeholder="กรุณากรอกข้อมูลเพิ่มเติม"></textarea>
                    <div class="char-count"><span id="currentCount">0</span>/150</div>
                </div>

              
                <div class="submit-button-container">
                    <button type="button" id="submitBtn">แจ้งซ่อม</button>
                </div>

            </form>
        </div>

       
        <div class="bottom-bar">
            <button type="button" id="backBtn" class="back-btn">ย้อนกลับ</button>
        </div>
    </main>

   
    <div class="modal-overlay" id="modalOverlay">
       
        <div class="modal-card" id="successModal" style="display: none;">
            <div class="icon-circle success-circle">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="modal-title">แจ้งซ่อมสำเร็จ</h2>
            <button class="close-btn" id="closeSuccessBtn">ตกลง</button>
        </div>

       
        <div class="modal-card" id="errorModal" style="display: none;">
            <div class="icon-circle error-circle">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <h2 class="modal-title">แจ้งซ่อมไม่สำเร็จ</h2>
            <button class="close-btn" id="closeErrorBtn">ปิด</button>
        </div>
    </div>

   
    <script src="scrips3.js"></script>
</body>
</html>
