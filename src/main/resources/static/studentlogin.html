 <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="css/studentlogin.css">
</head>
<body>

    <header class="top-bar"></header>

    <main class="main-container">
        <div class="login-card">
            <h1 class="card-title">เข้าสู่ระบบ</h1>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">ชื่อผู้ใช้ *</label>
                    <input type="text" id="username" placeholder="ชื่อผู้ใช้หรือเบอร์โทรศัพท์" required>
                </div>

                <div class="input-group">
                    <label for="password">รหัสผ่าน *</label>
                    <input type="password" id="password" placeholder="รหัสผ่าน" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                        จำฉันไว้
                    </label>
                    <a href="#" class="forgot-password">ลืมรหัสผ่าน ?</a>
                </div>

                <button type="submit" class="btn btn-login">Log in</button>
            </form>

            <div class="register-section">
                <p class="register-text">ยังไม่ได้เป็นสมาชิก ?</p>
                <button type="button" id="registerBtn" class="btn btn-register">ลงทะเบียนสมาชิกใหม่</button>
            </div>

            <hr class="divider">

            <div class="language-switch">
                <span class="lang-option active" id="langTH">TH</span>
                <span class="lang-option" id="langEN">EN</span>
            </div>
        </div>
    </main>

    <script src="js/studentlogin.js"></script>
</body>
</html>
