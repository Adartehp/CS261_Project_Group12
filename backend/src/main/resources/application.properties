spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dormrepair?useSSL=false&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
management.endpoints.web.exposure.include=health
spring.jpa.open-in-view=false

spring.web.error.include-stacktrace=never
# TU REST API (US1-A) ตั้ง TU_API_KEY ใน .env
tu.api.base-url=${TU_API_BASE_URL:https://restapi.tu.ac.th}
tu.api.key=${TU_API_KEY:}
