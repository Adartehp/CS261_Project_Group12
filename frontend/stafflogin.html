<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบเจ้าหน้าที่</title>
    <link rel="stylesheet" href="css/stafflogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="home-link" title="กลับสู่หน้าหลัก">
            <i class="fa-solid fa-arrow-left"></i>
            <span id="homeLinkText">หน้าแรก</span>
        </a>
    </header>

    <main class="main-container">
        <div class="login-card">
            <h1 class="card-title" id="cardTitle">เข้าสู่ระบบเจ้าหน้าที่</h1>

            <div id="errorMsg" class="error-msg" style="display: none;"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username" id="usernameLabel">ชื่อผู้ใช้ (เจ้าหน้าที่) *</label>
                    <input type="text" id="username" placeholder="เช่น staff01" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password" id="passwordLabel">รหัสผ่าน *</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="รหัสผ่าน" required autocomplete="current-password">
                        <button type="button" id="togglePasswordBtn" class="toggle-password-btn" aria-label="แสดงรหัสผ่าน" tabindex="-1">
                            <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                        <span id="rememberMeText">จำฉันไว้</span>
                    </label>
                    <a href="#" class="forgot-password" id="forgotPasswordLink">ลืมรหัสผ่าน ?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-login">เข้าสู่ระบบ</button>
            </form>

            <hr class="divider">

            <div class="language-switch">
                <span class="lang-option active" id="langTH">TH</span>
                <span class="lang-option" id="langEN">EN</span>
            </div>
        </div>
    </main>

    <script src="js/stafflogin.js"></script>
</body>
</html>
