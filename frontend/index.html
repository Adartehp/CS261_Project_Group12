<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมหอพัก</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="main-container">
        <div class="card">
            <h1 class="title">ระบบแจ้งซ่อมหอพัก</h1>
            <p class="subtitle">กรุณาเลือกประเภทผู้ใช้งานเพื่อเข้าสู่ระบบ</p>

            <div class="btn-group">
                <button type="button" id="studentLoginBtn" class="role-btn student-btn">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>สำหรับนักศึกษา</span>
                </button>

                <button type="button" id="staffLoginBtn" class="role-btn staff-btn">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>สำหรับเจ้าหน้าที่</span>
                </button>
            </div>
        </div>
    </main>

    <script src="js/index.js"></script>
</body>
</html>
