<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบนักศึกษา</title>
    <link rel="stylesheet" href="css/studentlogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="home-link" title="กลับสู่หน้าหลัก">
            <i class="fa-solid fa-arrow-left"></i>
            <span>หน้าแรก</span>
        </a>
    </header>

    <main class="main-container">
        <div class="login-card">
            <h1 class="card-title">เข้าสู่ระบบนักศึกษา</h1>

            <div id="errorMsg" class="error-msg" style="display: none;"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">อีเมลนักศึกษา (@dome.tu.ac.th) *</label>
                    <input type="email" id="username" placeholder="เช่น somchai.jai@dome.tu.ac.th" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">รหัสนักศึกษา (10 หลัก) *</label>
                    <input type="password" id="password" placeholder="รหัสนักศึกษา 10 หลัก" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                        จำฉันไว้
                    </label>
                    <a href="#" class="forgot-password" onclick="alert("กรุณาติดต่อเจ้าหน้าที่ดูแลระบบของมหาวิทยาลัย"); return false;">ลืมรหัสผ่าน ?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-login">เข้าสู่ระบบ</button>
            </form>

            <div class="tu-notice">
                <p><i class="fa-solid fa-circle-info"></i> ตรวจสอบตัวตนผ่านระบบ TU API ด้วยอีเมล @dome.tu.ac.th และรหัสนักศึกษา</p>
            </div>

            <hr class="divider">

            <div class="language-switch">
                <span class="lang-option active" id="langTH">TH</span>
                <span class="lang-option" id="langEN">EN</span>
            </div>
        </div>
    </main>

    <script src="js/studentlogin.js"></script>
</body>
</html>
